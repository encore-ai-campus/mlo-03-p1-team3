---
- name: Temporarily observe Uvicorn transport scheduling
  hosts: api
  serial: 1
  become: true
  gather_facts: false
  vars:
    transport_timing_enabled: true
  tasks:
    - ansible.builtin.copy:
        src: '../../backend/app/observability/{{ item }}'
        dest: '/opt/podobank/backend/app/observability/{{ item }}'
        owner: podobank
        group: podobank
        mode: '0644'
        backup: true
      loop: [tracing.py, trace_server.py]
      notify: Restart API
    - ansible.builtin.file:
        path: /etc/systemd/system/podobank-api.service.d
        state: directory
        mode: '0755'
    - name: Enable timestamp-only diagnostic protocol
      ansible.builtin.copy:
        dest: /etc/systemd/system/podobank-api.service.d/transport-timing.conf
        mode: '0644'
        content: |
          [Service]
          ExecStart=
          ExecStart=/opt/podobank/backend/.venv/bin/python -m app.observability.trace_server
      when: transport_timing_enabled | bool
      notify: Restart API
    - name: Restore the original Uvicorn command after diagnostics
      ansible.builtin.file:
        path: /etc/systemd/system/podobank-api.service.d/transport-timing.conf
        state: absent
      when: not (transport_timing_enabled | bool)
      notify: Restart API
    - ansible.builtin.meta: flush_handlers
    - ansible.builtin.uri:
        url: http://127.0.0.1:8000/api/v1/health
        status_code: 200
      register: ready
      until: ready.status | default(0) == 200
      retries: 30
      delay: 2
  handlers:
    - name: Restart API
      ansible.builtin.systemd:
        name: podobank-api
        state: restarted
        daemon_reload: true
